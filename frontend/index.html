<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Antarctic Station Command</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230277a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cline x1='12' y1='2' x2='12' y2='22'/%3E%3Cline x1='2' y1='12' x2='22' y2='12'/%3E%3Cline x1='4.93' y1='4.93' x2='19.07' y2='19.07'/%3E%3Cline x1='19.07' y1='4.93' x2='4.93' y2='19.07'/%3E%3Ccircle cx='12' cy='12' r='2.5' fill='%230277a8'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#c8e8f8;--surface:#dff2fc;--card:rgba(240,249,255,.90);--card2:rgba(232,245,254,.92);
  --border:#90cce8;--border2:#5bb4da;--cyan:#0277a8;--blue:#0369a1;
  --green:#059669;--yellow:#d97706;--orange:#c2410c;--red:#dc2626;--purple:#6d28d9;
  --text:#0c1f35;--muted:#234e6e;--dim:#3b779c;
  --radius:10px;--shadow:0 2px 12px rgba(2,119,168,.10);
  --shadow-md:0 4px 20px rgba(2,119,168,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow-x:hidden}
body{background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(56,189,248,.22),transparent),
  radial-gradient(ellipse 60% 50% at 80% 80%,rgba(14,165,233,.18),transparent),
  radial-gradient(ellipse 50% 40% at 50% 50%,rgba(186,230,253,.25),transparent),
  linear-gradient(160deg,#b3ddf5 0%,#c8e8f8 40%,#d8f0fc 100%);overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle 120px at 10% 20%,rgba(255,255,255,.18),transparent),
  radial-gradient(circle 80px at 90% 30%,rgba(255,255,255,.15),transparent),
  radial-gradient(circle 60px at 50% 70%,rgba(255,255,255,.12),transparent);pointer-events:none;z-index:0}
#app{display:flex;min-height:100vh;position:relative;z-index:1;max-width:100vw;overflow-x:hidden}
a,button{cursor:pointer;font-family:inherit}
svg{display:inline-block;vertical-align:middle;flex-shrink:0}
/* layout */
#sidebar{width:220px;min-height:100vh;background:rgba(200,235,252,.88);backdrop-filter:blur(10px);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:width .2s,transform .2s;flex-shrink:0;z-index:10}
#sidebar.collapsed{width:56px}
#main{flex:1;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden;max-width:100vw}
#topbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(220,244,254,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);min-height:52px;flex-shrink:0}
.page{padding:20px 22px;animation:pageFade 160ms cubic-bezier(0.16,1,0.3,1);overflow-y:auto;flex:1;max-height:calc(100vh - 52px - 32px)}
@keyframes pageFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* sidebar nav */
.nav-logo{display:flex;align-items:center;gap:10px;padding:14px 12px 10px;border-bottom:1px solid var(--border)}
.nav-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--cyan),var(--blue));border-radius:9px;display:grid;place-items:center;flex-shrink:0;color:#fff;box-shadow:0 2px 8px rgba(2,119,168,.25)}
nav{flex:1;overflow-y:auto;padding:6px 0}
.ns{font-size:.74rem;font-weight:700;color:var(--dim);padding:10px 14px 4px;text-transform:uppercase;letter-spacing:.08em;overflow:hidden;white-space:nowrap}
.ni{display:flex;align-items:center;gap:8px;padding:9px 14px;width:100%;background:none;border:none;color:var(--muted);font-size:.88rem;font-weight:600;text-align:left;border-radius:0;transition:background .15s,color .15s,padding-left .15s;white-space:nowrap;overflow:hidden;position:relative}
.ni:hover{background:rgba(2,119,168,.12);color:var(--cyan);padding-left:17px}
.ni.act{background:rgba(2,119,168,.16);color:var(--cyan);font-weight:700;border-left:3px solid var(--cyan)}
.ni .ico{width:18px;height:18px;flex-shrink:0;color:inherit}
.ni .lbl{flex:1;overflow:hidden;text-overflow:ellipsis}
.nbadge{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:.65rem;font-weight:700;display:none;place-items:center;line-height:1}
#sidebar.collapsed .lbl,#sidebar.collapsed .ns,#sidebar.collapsed #sb-lbl,#sidebar.collapsed .nbadge{display:none}
#sidebar.collapsed .ni{padding:10px;justify-content:center}
/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-md{padding:16px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.kpi-v{font-size:1.85rem;font-weight:800;color:var(--cyan);line-height:1.1}
.kpi-l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;font-weight:700}
.kpi-sub{font-size:.82rem;color:var(--dim);margin-top:3px}
/* grids */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:9999px;font-size:.76rem;font-weight:700;letter-spacing:.02em}
.tg{background:rgba(5,150,105,.15);color:#065f46;border:1px solid rgba(5,150,105,.35)}
.ty{background:rgba(217,119,6,.15);color:#92400e;border:1px solid rgba(217,119,6,.35)}
.tr{background:rgba(220,38,38,.15);color:#991b1b;border:1px solid rgba(220,38,38,.35)}
.tb{background:rgba(2,119,168,.14);color:#0277a8;border:1px solid rgba(2,119,168,.3)}
.tG{background:rgba(100,116,139,.14);color:#334155;border:1px solid rgba(100,116,139,.3)}
.tp{background:rgba(109,40,217,.14);color:#5b21b6;border:1px solid rgba(109,40,217,.35)}
/* typography & headings */
.sec-hd{font-size:.95rem;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.dg{background:var(--green)}.dy{background:var(--yellow)}.dr{background:var(--red)}.db{background:var(--cyan)}
/* inputs & controls */
input,select,textarea{background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:.88rem;color:var(--text);font-family:inherit;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(2,119,168,.2)}
/* buttons with clear hover & focus states */
button{font-family:inherit}
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .15s ease}
button.btn:hover{filter:brightness(1.06);box-shadow:0 2px 8px rgba(2,119,168,.2);transform:translateY(-1px)}
button.btn:active{transform:scale(.97)}
.btn-p{background:var(--cyan);color:#fff}.btn-p:hover{background:var(--blue)}
.btn-g{background:rgba(5,150,105,.18);color:#065f46;border:1px solid rgba(5,150,105,.35)}.btn-g:hover{background:rgba(5,150,105,.28)}
.btn-r{background:rgba(220,38,38,.16);color:#991b1b;border:1px solid rgba(220,38,38,.35)}.btn-r:hover{background:rgba(220,38,38,.26)}
.btn-y{background:rgba(217,119,6,.16);color:#92400e;border:1px solid rgba(217,119,6,.35)}.btn-y:hover{background:rgba(217,119,6,.26)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(2,119,168,.06)}
/* responsive canvas charts */
canvas.chart-cv, .card canvas.chart-cv{width:100% !important;display:block;box-sizing:border-box}
/* progress bar */
.prog{height:7px;background:rgba(2,119,168,.14);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .5s ease}
/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;padding:9px 12px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 12px;border-bottom:1px solid rgba(144,204,232,.45);vertical-align:middle}
.tbl tr:hover td{background:rgba(2,119,168,.05)}
/* tabs */
.tabs{display:flex;gap:4px;padding:4px;background:rgba(2,119,168,.08);border-radius:10px;margin-bottom:14px}
.tab{flex:1;padding:8px 12px;border:none;border-radius:7px;background:none;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.tab:hover{color:var(--cyan);background:rgba(255,255,255,.4)}
.tab.act{background:var(--card);color:var(--cyan);box-shadow:var(--shadow);font-weight:700}
/* alerts */
.al-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;border-left:4px solid transparent;display:flex;gap:10px;align-items:flex-start}
.al-card.critical{border-left-color:var(--red)}
.al-card.warning{border-left-color:var(--yellow)}
.al-card.info{border-left-color:var(--cyan)}
/* toasts */
#toasts{position:fixed;top:14px;right:14px;z-index:2000;display:flex;flex-direction:column;gap:6px;max-width:340px}
.toast{padding:11px 16px;border-radius:10px;font-size:.85rem;box-shadow:var(--shadow-md);animation:pageFade .2s;transition:opacity .3s;backdrop-filter:blur(8px);font-weight:500}
.tst-r{background:rgba(254,242,242,.96);border:1px solid rgba(220,38,38,.35);color:#991b1b}
.tst-y{background:rgba(255,251,235,.96);border:1px solid rgba(217,119,6,.35);color:#92400e}
.tst-g{background:rgba(240,253,244,.96);border:1px solid rgba(5,150,105,.35);color:#065f46}
.tst-b{background:rgba(240,249,255,.96);border:1px solid rgba(2,119,168,.35);color:#0277a8}
/* connectivity banner */
#conn-banner{display:none;align-items:center;gap:8px;padding:8px 16px;font-size:.84rem;border-bottom:1px solid;flex-shrink:0;font-weight:500}
/* skeleton loading */
.skel{background:linear-gradient(90deg,rgba(2,119,168,.08) 25%,rgba(2,119,168,.16) 50%,rgba(2,119,168,.08) 75%);background-size:300% 100%;animation:sk 1.2s ease infinite;border-radius:6px;height:18px}
@keyframes sk{0%{background-position:100%}100%{background-position:-100%}}
/* lock badge */
.locked{opacity:.45;pointer-events:none;position:relative}
.lock-note{font-size:.72rem;color:var(--muted);font-style:italic}
/* conn status pill */
.conn-pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:9999px;font-size:.76rem;font-weight:700}
.conn-online{background:rgba(5,150,105,.14);border:1px solid rgba(5,150,105,.35);color:#065f46}
.conn-degraded{background:rgba(217,119,6,.14);border:1px solid rgba(217,119,6,.35);color:#92400e}
.conn-offline{background:rgba(220,38,38,.14);border:1px solid rgba(220,38,38,.35);color:#991b1b}
.conn-syncing{background:rgba(2,119,168,.14);border:1px solid rgba(2,119,168,.35);color:#0277a8}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.footer-bar{padding:8px 22px;border-top:1px solid var(--border);color:var(--dim);font-size:.76rem;display:flex;justify-content:space-between;flex-shrink:0;background:rgba(220,244,254,.6)}
/* resupply */
.rsup-ok{background:rgba(5,150,105,.08);border:1px solid rgba(5,150,105,.3);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.rsup-warn{background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.3);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.rsup-crit{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.3);border-radius:8px;padding:10px 12px;margin-bottom:6px}
/* station switcher */
.stn-sw{display:flex;gap:4px;margin:8px 10px;background:rgba(2,119,168,.1);border-radius:8px;padding:3px}
.stn-btn{flex:1;padding:5px 8px;border:none;border-radius:6px;font-size:.76rem;font-weight:700;cursor:pointer;color:var(--muted);background:none;transition:all .15s}
.stn-btn:hover{color:var(--cyan);background:rgba(255,255,255,.5)}
.stn-btn.act{background:var(--card);color:var(--cyan);box-shadow:var(--shadow)}
/* isometric twin */
#twin-canvas{cursor:pointer;border-radius:var(--radius);width:100%;max-width:100%;display:block}
.twin-info{position:absolute;pointer-events:none;background:rgba(240,249,255,.96);border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:.84rem;box-shadow:var(--shadow-md);min-width:200px;max-width:260px;backdrop-filter:blur(8px);z-index:20}
/* responsive breakpoints */
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(12,31,53,.4);backdrop-filter:blur(2px);z-index:99}
@media (max-width:1024px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  #sidebar{position:fixed;top:0;bottom:0;left:0;z-index:100;box-shadow:4px 0 24px rgba(2,119,168,.25);transform:translateX(0)}
  #sidebar.collapsed{transform:translateX(-100%);width:220px}
  #sidebar-overlay.active{display:block}
  .g4,.g3,.g2{grid-template-columns:1fr}
  .page{padding:14px 12px}
  #topbar{padding:8px 10px}
}
</style>

<script>
(function(){
  const c=document.getElementById('icebg');
  const resize=()=>{c.width=innerWidth;c.height=innerHeight};
  resize();window.addEventListener('resize',resize);
  const ctx=c.getContext('2d');
  const flakes=Array.from({length:50},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2.5+.8,spd:Math.random()*.5+.3,drift:(Math.random()-.5)*.35,op:Math.random()*.5+.2}));
  function drawMtns(){
    ctx.beginPath();ctx.moveTo(0,c.height);ctx.lineTo(0,c.height*.78);ctx.lineTo(c.width*.08,c.height*.7);ctx.lineTo(c.width*.18,c.height*.58);ctx.lineTo(c.width*.28,c.height*.65);ctx.lineTo(c.width*.36,c.height*.48);ctx.lineTo(c.width*.44,c.height*.62);ctx.lineTo(c.width*.52,c.height*.42);ctx.lineTo(c.width*.6,c.height*.56);ctx.lineTo(c.width*.68,c.height*.38);ctx.lineTo(c.width*.74,c.height*.5);ctx.lineTo(c.width*.82,c.height*.44);ctx.lineTo(c.width*.9,c.height*.6);ctx.lineTo(c.width,c.height*.7);ctx.lineTo(c.width,c.height);ctx.closePath();
    const gm=ctx.createLinearGradient(0,c.height*.4,0,c.height);gm.addColorStop(0,'rgba(255,255,255,.5)');gm.addColorStop(.4,'rgba(200,235,255,.4)');gm.addColorStop(1,'rgba(170,215,240,.25)');ctx.fillStyle=gm;ctx.fill();
    ctx.beginPath();ctx.moveTo(0,c.height);ctx.lineTo(0,c.height*.88);ctx.lineTo(c.width*.12,c.height*.82);ctx.lineTo(c.width*.22,c.height*.75);ctx.lineTo(c.width*.3,c.height*.8);ctx.lineTo(c.width*.42,c.height*.72);ctx.lineTo(c.width*.55,c.height*.78);ctx.lineTo(c.width*.66,c.height*.69);ctx.lineTo(c.width*.78,c.height*.76);ctx.lineTo(c.width*.88,c.height*.7);ctx.lineTo(c.width,c.height*.8);ctx.lineTo(c.width,c.height);ctx.closePath();
    const gf=ctx.createLinearGradient(0,c.height*.7,0,c.height);gf.addColorStop(0,'rgba(210,240,255,.6)');gf.addColorStop(1,'rgba(185,225,248,.35)');ctx.fillStyle=gf;ctx.fill();
  }
  function tick(){ctx.clearRect(0,0,c.width,c.height);drawMtns();for(const f of flakes){ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.28);ctx.fillStyle=`rgba(255,255,255,${f.op})`;ctx.fill();f.y+=f.spd;f.x+=f.drift;if(f.y>c.height+4){f.y=-4;f.x=Math.random()*c.width}if(f.x<0)f.x=c.width;if(f.x>c.width)f.x=0;}requestAnimationFrame(tick);}
  tick();
})();
</script>

function daysToResupply(stnId){

}

/* ── SINGLE SOURCE OF TRUTH: RENEWABLE SHARE ─────────────── */
function calcRenewableShare(stnId){
  const stn=stnId?(STATION_DATA[stnId]||ST()):ST();
  const s=stn.sensors;
  const solar=s.solar_gen?.v??0;
  const wind=s.wind_gen?.v??0;
  const tot=s.power_gen?.v||(solar+wind+(s.diesel_gen?.v??0))||1;
  return Math.round(((solar+wind)/tot)*100);
}

/* ── EXPLAINABLE RISK MODEL ─────────────────────────────────── */
function calcRisk(e){
  const ageFactor=clamp(e.hrs/30000,0,1);
  const healthFactor=(100-e.health)/100;
  const svcDue=new Date(e.next)<new Date()?0.25:0;
  const risk=clamp(ageFactor*0.35+healthFactor*0.5+svcDue*0.15,0,1);
  const parts=[];
  if(healthFactor>0.15)parts.push(`Health decline (${Math.round(healthFactor*50)}%)`);
  if(ageFactor>0.2)parts.push(`Operating hours (${Math.round(ageFactor*35)}%)`);
  if(svcDue>0)parts.push('Service overdue (+25%)');
  return{risk,pct:Math.round(risk*100),drivers:parts.length?parts:['Normal wear']};
}

/* ── SENSOR ENGINE ──────────────────────────────────────────── */
function initStationSensors(stnId){
  const stn=STATION_DATA[stnId];
  const bv=stn.bv;
  for(const[k,def]of Object.entries(SD)){
    const v=bv[k]??((def.mn+def.mx)/2);
    stn.sensors[k]={v:parseFloat(v.toFixed(2)),u:def.u,st:sSt(k,v)};
    stn.hist[k]=[];
    const tempHist=[];
    let walkVal=v;
    tempHist.push({ts:new Date().toISOString(),v:parseFloat(walkVal.toFixed(2))});
    for(let i=1;i<=288;i++){
      walkVal=clamp(drift(walkVal,def.d*0.6),def.mn,def.mx);
      tempHist.unshift({ts:new Date(Date.now()-i*5*60000).toISOString(),v:parseFloat(walkVal.toFixed(2))});
    }
    stn.hist[k]=tempHist;
  }
  stn.equipment=stn.equipment.map(e=>{const r=calcRisk(e);return{...e,risk:r.risk};});
}

function sSt(k,v){
  const def=SD[k];if(!def)return'ok';
  const[lo,hi]=def.n;
  if(k==='smoke_lab')return v>50?'crit':v>15?'warn':'ok';
  if(k==='co_level')return v>35?'crit':v>25?'warn':'ok';
  if(k==='fuel_level'||k==='battery_pct'||k==='water_level')return v<10?'crit':v<25?'warn':'ok';
  if(v<lo*.85||v>hi*1.15)return'crit';if(v<lo||v>hi)return'warn';return'ok';
}

const LAF={};
function simTick(){
  for(const stnId of Object.keys(STATION_DATA)){
    const stn=STATION_DATA[stnId];
    const bv=stn.bv;
    for(const[k,def]of Object.entries(SD)){
      const old=stn.sensors[k]?.v??bv[k];
      const nv=clamp(drift(old,def.d),def.mn,def.mx);
      stn.sensors[k]={v:parseFloat(nv.toFixed(2)),u:def.u,st:sSt(k,nv)};
      stn.hist[k].push({ts:nowISO(),v:parseFloat(nv.toFixed(2))});
      if(stn.hist[k].length>360)stn.hist[k].shift();
    }
    for(const e of stn.equipment){
      e.hrs+=0.001;
      if(Math.random()<.001)e.health=clamp(e.health-(Math.random()*2),0,100);
      const r=calcRisk(e);e.risk=r.risk;
      e.status=e.health>=80?'online':e.health>=60?'warning':'critical';
    }
  }
  queueOrTransmit();
  chkAutoAlerts();
  if(APP.page==='dashboard')refreshDTiles();
  if(APP.page==='connectivity')refreshConnTiles();
}

/* ── CONNECTIVITY ENGINE ────────────────────────────────────── */
let connTimer=null;
function initConn(){scheduleDrop();}
function scheduleDrop(){
  const ms=(10+Math.random()*10)*60*1000; // 10-20 min online
  if(connTimer)clearTimeout(connTimer);
  connTimer=setTimeout(startDrop,ms);
}
function manualSimDrop(){
  if(connTimer)clearTimeout(connTimer);
  if(CONN.status==='offline'){toast('Satellite link is already offline. Readings are queuing.','y');return;}
  CONN.status='offline';CONN.bandwidth='none';
  CONN.totalDrops++;
  CONN.history.unshift({ts:nowISO(),event:'Simulated link outage initiated — offline banner active',type:'drop'});
  if(CONN.history.length>25)CONN.history.pop();
  updConnBanner();
  toast('Satellite link outage simulated. Offline mode active across all pages.','r');
  if(APP.page==='connectivity')rConnectivity();
}
function manualRestoreLink(){
  if(connTimer)clearTimeout(connTimer);
  if(CONN.status==='online'){toast('Satellite link is already online.','b');return;}
  CONN.status='syncing';CONN.bandwidth='limited';
  CONN.history.unshift({ts:nowISO(),event:`Satellite link restored — uploading ${CONN.queue.length} readings`,type:'restore'});
  if(CONN.history.length>25)CONN.history.pop();
  updConnBanner();
  toast(`Satellite link restored. Uploading ${CONN.queue.length} queued readings...`,'b');
  if(APP.page==='connectivity')rConnectivity();
  startSync();
}
function startDrop(){
  if(CONN.status==='offline')return;
  CONN.status='offline';CONN.bandwidth='none';
  CONN.totalDrops++;
  CONN.history.unshift({ts:nowISO(),event:'Satellite link dropped (scheduled pass)',type:'drop'});
  if(CONN.history.length>25)CONN.history.pop();
  updConnBanner();
  toast('Satellite link lost — switching to offline mode. Data will queue locally.','w');
  const ms=(2+Math.random()*3)*60*1000; // 2-5 min offline
  if(connTimer)clearTimeout(connTimer);
  connTimer=setTimeout(endDrop,ms);
}
function endDrop(){
  CONN.status='syncing';CONN.bandwidth='limited';
  CONN.history.unshift({ts:nowISO(),event:'Link restored — syncing',type:'restore'});
  if(CONN.history.length>15)CONN.history.pop();
  updConnBanner();
  toast('Satellite link restored. Uploading '+CONN.queue.length+' queued readings...','b');
  startSync();
}
function startSync(){
  if(CONN.queue.length===0){finalizeOnline();return;}
  CONN.syncing=true;
  const total=CONN.queue.length;let processed=0;
  const iv=setInterval(()=>{
    const batch=Math.min(3,CONN.queue.length);
    CONN.queue.splice(0,batch);processed+=batch;
    CONN.syncProgress=Math.min(Math.round(processed/total*100),100);
    updConnBanner();
    if(CONN.queue.length===0){clearInterval(iv);finalizeOnline();}
  },600);
}
function finalizeOnline(){
  CONN.status='online';CONN.lastSync=new Date();CONN.bandwidth='full';
  CONN.syncing=false;CONN.syncProgress=0;
  CONN.history.unshift({ts:nowISO(),event:'Sync complete — all data uploaded',type:'sync'});
  updConnBanner();toast('Sync complete. All queued data uploaded to HQ.','g');
  scheduleDrop();
}
function queueOrTransmit(){
  if(CONN.status==='offline'){
    if(SETTINGS.storeAndForward){
      CONN.queue.push({ts:nowISO(),type:'sensor_batch',station:APP.station,count:Object.keys(SD).length,kb:parseFloat((Object.keys(SD).length*.065).toFixed(2))});
      updConnBanner();
    }
  } else {
    CONN.lastSync=new Date();
  }
}
function updConnBanner(){
  const b=el('conn-banner');if(!b)return;
  const qlen=CONN.queue.length;
  const qkb=(CONN.queue.reduce((s,x)=>s+(x.kb||0),0)).toFixed(1);
  if(!SETTINGS.showOfflineBanner){
    b.style.display='none';
  } else if(CONN.status==='offline'){
    b.style.display='flex';b.style.background='rgba(220,38,38,.08)';b.style.borderColor='rgba(220,38,38,.35)';
    b.innerHTML=`<span style="color:var(--red)">${ic('wifioff',14)}</span><strong style="color:var(--red)">SATELLITE LINK OFFLINE</strong><span style="color:var(--muted)">— Last known state. Queued:</span><strong>${qlen} readings (${qkb} KB)</strong><span style="margin-left:auto;font-size:.7rem;color:var(--dim)">Will sync on link restoration</span>`;
  } else if(CONN.status==='syncing'){
    b.style.display='flex';b.style.background='rgba(217,119,6,.07)';b.style.borderColor='rgba(217,119,6,.3)';
    b.innerHTML=`<span style="color:var(--yellow)">${ic('refresh',14)}</span><strong style="color:var(--yellow)">SYNCING</strong><span style="color:var(--muted)">Uploading ${qlen} queued readings</span><div style="flex:1;max-width:160px;height:5px;background:rgba(217,119,6,.2);border-radius:3px;overflow:hidden"><div style="width:${CONN.syncProgress}%;height:100%;background:var(--yellow);transition:width .4s"></div></div><strong style="color:var(--yellow)">${CONN.syncProgress}%</strong>`;
  } else {
    b.style.display='none';
  }

/* ── CANVAS CHART HELPERS ───────────────────────────────────── */
function gH(stnId,key,pts=48){
  const h=STATION_DATA[stnId].hist[key]||[];
  if(!h.length)return[];
  const step=Math.max(1,Math.floor(h.length/pts));
  const out=[];for(let i=h.length-1;i>=0&&out.length<pts;i-=step)out.unshift(h[i]);
  return out;
}

function lChart(cv,datasets,opts={}){
  if(!cv)return;
  const pw=cv.parentElement?cv.parentElement.clientWidth:0;
  if(pw>60){
    const tw=Math.round(cv.clientWidth||pw);
    if(tw>100&&cv.width!==tw)cv.width=tw;
  }
  const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const pad={t:14,r:16,b:28,l:46};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const allV=datasets.flatMap(d=>d.data.map(p=>p.v));
  if(!allV.length)return;
  const mn=opts.mn??Math.min(...allV),mx=opts.mx??Math.max(...allV);
  const range=mx-mn||1;
  const sc=(v)=>pad.t+ch-((v-mn)/range*ch);
  const sx=(i,tot)=>pad.l+i/(tot-1||1)*cw;
  // grid
  ctx.strokeStyle='rgba(2,119,168,.14)';ctx.lineWidth=.75;
  for(let i=0;i<=4;i++){const y=pad.t+ch/4*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();}
  // Y-axis labels: 12px bold with high contrast
  ctx.fillStyle='#0c1f35';ctx.font='600 12px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
  for(let i=0;i<=4;i++){const v=mx-(range/4*i);ctx.fillText(v.toFixed(0),pad.l-6,pad.t+ch/4*i);}
  // X-axis time labels: 12px with good contrast
  if(datasets[0]?.data.length>1){
    const tot=datasets[0].data.length;
    const idxs=[0,Math.floor(tot*.25),Math.floor(tot*.5),Math.floor(tot*.75),tot-1];
    ctx.fillStyle='#234e6e';ctx.textAlign='center';ctx.textBaseline='top';ctx.font='600 12px system-ui';
    for(const i of idxs){const d=datasets[0].data[i];if(!d)continue;const t=new Date(d.ts);ctx.fillText(`${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`,sx(i,tot),pad.t+ch+6);}
  }
  // lines + fill
  for(const ds of datasets){
    if(!ds.data.length)continue;
    const tot=ds.data.length;
    ctx.beginPath();ctx.moveTo(sx(0,tot),sc(ds.data[0].v));
    for(let i=1;i<tot;i++)ctx.lineTo(sx(i,tot),sc(ds.data[i].v));
    ctx.strokeStyle=ds.color||'var(--cyan)';ctx.lineWidth=2;ctx.stroke();
    if(ds.fill){
      ctx.lineTo(sx(tot-1,tot),pad.t+ch);ctx.lineTo(pad.l,pad.t+ch);ctx.closePath();
      ctx.fillStyle=ds.fill;ctx.fill();
    }
  }
}

function dChart(cv,slices){
  if(!cv)return;
  const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,r=Math.min(W,H)*.38,ri=r*.62;
  const tot=slices.reduce((s,x)=>s+x.v,0)||1;
  let ang=-Math.PI/2;
  for(const s of slices){
    const a=s.v/tot*2*Math.PI;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,ang,ang+a);ctx.fillStyle=s.color;ctx.fill();
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,ang,ang+a);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.stroke();
    ang+=a;
  }
  ctx.beginPath();ctx.arc(cx,cy,ri,0,Math.PI*2);ctx.fillStyle='rgba(240,249,255,.95)';ctx.fill();
  if(slices.length){const top=slices.reduce((a,b)=>a.v>b.v?a:b);ctx.fillStyle=top.color;ctx.font=`bold ${Math.round(W*.1)}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(Math.round(top.v/tot*100)+'%',cx,cy);}
}

function bChart(cv,labels,datasets){
  if(!cv)return;
  const pw=cv.parentElement?cv.parentElement.clientWidth:0;
  if(pw>60){
    const tw=Math.round(cv.clientWidth||pw);
    if(tw>100&&cv.width!==tw)cv.width=tw;
  }
  const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const pad={t:14,r:16,b:28,l:46};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const allV=datasets.flatMap(d=>d.data);
  const mx=Math.max(...allV,1);
  const bw=cw/labels.length,bInner=bw*.55;
  ctx.strokeStyle='rgba(2,119,168,.14)';ctx.lineWidth=.75;
  for(let i=0;i<=4;i++){const y=pad.t+ch/4*i;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();}
  ctx.fillStyle='#0c1f35';ctx.font='600 12px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
  for(let i=0;i<=4;i++)ctx.fillText(Math.round(mx-mx/4*i),pad.l-6,pad.t+ch/4*i);
  for(let i=0;i<labels.length;i++){
    const x=pad.l+i*bw+(bw-bInner)/2;
    for(let j=0;j<datasets.length;j++){
      const v=datasets[j].data[i]||0;const bh=Math.max(2,(v/mx)*ch);
      ctx.fillStyle=datasets[j].color||'var(--cyan)';
      ctx.fillRect(x+j*(bInner/datasets.length),pad.t+ch-bh,bInner/datasets.length-2,bh);
    }
    ctx.fillStyle='#234e6e';ctx.font='600 12px system-ui';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(labels[i],pad.l+(i+.5)*bw,pad.t+ch+6);
  }
}

function refreshDTiles(){

      <div style="font-size:.82rem;font-weight:700;color:var(--cyan);margin-bottom:6px">${ic('ship',14)} Next Resupply Window</div>

        <div>${ic('ship',12)} <strong>${stn.resupplyShip}</strong></div>
        <div>Scheduled: <strong>${stn.resupplyDate}</strong></div>
        <div>Days remaining: <strong style="color:var(--cyan)">${Math.max(0,Math.ceil((new Date(stn.resupplyDate)-new Date())/86400000))} days</strong></div>

      <div style="margin-top:8px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border);padding-top:8px">

      </div>
    </div>

      const daysToResupply=Math.max(0,Math.ceil((new Date(stn.resupplyDate)-new Date())/86400000));
      const daysToEmpty=Math.floor(item.qty/item.rate);
      const daysToMin=Math.floor((item.qty-item.min)/item.rate);
      const willRunOut=daysToMin<daysToResupply;
      const buffer=daysToMin-daysToResupply;
      const cls=willRunOut?'rsup-crit':buffer<14?'rsup-warn':'rsup-ok';
      const emergQty=willRunOut?Math.ceil((daysToResupply-daysToMin)*item.rate+item.min):0;
      return`<div class="${cls}">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div>
            <div style="font-weight:700;color:var(--text);font-size:.85rem">${item.n} <span class="tag ${willRunOut?'tr':buffer<14?'ty':'tg'}" style="font-size:.65rem">${willRunOut?'WILL RUN OUT':buffer<14?'TIGHT':'SAFE'}</span></div>

          </div>
          <div style="text-align:right">
            <div style="font-size:.75rem;color:var(--muted)">Hits minimum in</div>
            <div style="font-size:1.1rem;font-weight:800;color:${willRunOut?'var(--red)':buffer<14?'var(--yellow)':'var(--green)'}">${daysToMin}d</div>
          </div>
        </div>
        ${willRunOut?`<div style="margin-top:8px;padding:6px 10px;background:rgba(220,38,38,.1);border-radius:6px;font-size:.75rem;color:#991b1b">
          <strong>Action required:</strong> Emergency order needed — ${emergQty.toLocaleString()} ${item.u} minimum to cover gap until resupply.
        </div>`:''}
        ${!willRunOut&&buffer<14?`<div style="margin-top:6px;font-size:.72rem;color:#92400e">Buffer: ${buffer} days past resupply — consider increasing next order quantity.</div>`:''}
      </div>`;
    }).join('')}
  </div>
  <div id="inv-forecast" style="display:none">
    <div class="card card-md">
      <div class="sec-hd">${ic('activity',14)} Fuel Consumption — 30-day Forecast</div>
      <canvas id="cv-fuel" class="chart-cv" height="150"></canvas>
    </div>
  </div>`;

      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">

          <span class="tag ${stC(w.st)}">${w.st.replace('-',' ').toUpperCase()}</span>

        <div style="font-weight:700;color:var(--text)">${w.title}</div>
        <div style="font-size:.72rem;color:var(--muted);margin-top:3px">${ic('users',10)} ${w.who||'Unassigned'} | Due: ${w.due} | Note: ${w.note}</div>

      ${canDo('workorder.close')&&w.st!=='completed'?`<button class="btn btn-g" style="padding:4px 10px;font-size:.72rem" onclick="woDone('${w.id}')">Mark Done</button>`:''}

    <table class="tbl">
      <thead><tr><th>Equipment</th><th>Health</th><th>Hours</th><th>Service Due</th><th>Risk Score</th><th>Risk Drivers</th><th>Recommendation</th></tr></thead>

          const r=calcRisk(e);const overdue=new Date(e.next)<new Date();
          const hasOverdue=overdue||r.drivers.some(d=>d.toLowerCase().includes('overdue'));
          const hasDecline=(e.health<80)||r.drivers.some(d=>d.toLowerCase().includes('health decline'));
          let rec='Routine monitoring';
          let recCls='color:var(--text)';
          if(hasOverdue&&hasDecline){
            rec='Schedule service (Overdue + Health decline)';
            recCls='color:var(--red);font-weight:700';
          }else if(hasOverdue){
            rec='Schedule service (Service overdue)';
            recCls='color:var(--red);font-weight:700';
          }else if(hasDecline){
            rec='Schedule service (Health decline)';
            recCls='color:var(--yellow);font-weight:700';
          }else if(r.pct>=50){
            rec='Inspect within 7 days';
            recCls='color:var(--orange);font-weight:600';
          }else if(r.pct>=25){
            rec='Inspect within 30 days';
            recCls='color:var(--muted)';
          }
          return`<tr>
            <td style="font-weight:600">${e.name}</td>
            <td><span style="color:${hcol(e.health)}">${Math.round(e.health)}%</span></td>
            <td>${e.hrs.toFixed(0)}h</td>
            <td><span class="tag ${overdue?'tr':'tg'}">${overdue?'OVERDUE':e.next}</span></td>

            <td style="font-size:.72rem;color:var(--muted)">${r.drivers.join(', ')}</td>
            <td style="font-size:.72rem;${recCls}">${rec}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>`;
}

  const wo=ST().workOrders.find(w=>w.id===id);if(wo)wo.st='completed';

function isoProj(gx,gy,gz,scale,cx,cy){
  const cos=Math.cos(Math.PI/6);const sin=Math.sin(Math.PI/6);
  return{x:cx+(gx-gy)*scale*cos,y:cy+(gx+gy)*scale*sin-gz*scale*0.88};
}

function drawIsoTwin(){
  const cv=el('twin-canvas');if(!cv)return;
  const pw=cv.parentElement?cv.parentElement.clientWidth:0;
  if(pw>80){
    const tw=Math.round(cv.clientWidth||pw);
    if(tw>100&&cv.width!==tw)cv.width=tw;
  }
  const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  const scale=Math.max(26,Math.min(38,Math.round(W*0.048)));
  const cx=W*0.34;const cy=H*0.32;
  const bldgs=APP.station==='maitri'?BLDGS_MAITRI:BLDGS_BHARATI;
  const s=ST().sensors;

  // Draw ground grid
  ctx.strokeStyle='rgba(2,119,168,.10)';ctx.lineWidth=.6;
  for(let i=0;i<=12;i++){
    const p1=isoProj(i,0,0,scale,cx,cy);const p2=isoProj(i,11,0,scale,cx,cy);
    ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    const p3=isoProj(0,i,0,scale,cx,cy);const p4=isoProj(12,i,0,scale,cx,cy);
    ctx.beginPath();ctx.moveTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.stroke();
  }

  // Proper depth sorting: back-to-front by center coordinates (gx + w/2 + gy + d/2)
  const sorted=[...bldgs].sort((a,b)=>((a.gx+a.w*0.5)+(a.gy+a.d*0.5))-((b.gx+b.w*0.5)+(b.gy+b.d*0.5)));

  for(const bl of sorted){
    const isSel=twinSelected===bl.id;
    const isCasc=twinCascade.includes(bl.id);
    let bStatus='online';
    for(const sk of bl.sns){const sv=s[sk];if(sv?.st==='crit'){bStatus='critical';break;}if(sv?.st==='warn')bStatus='warning';}

    const typeCol=TWIN_TYPE_COLS[bl.cat]||TWIN_TYPE_COLS.util;
    let topCol,leftCol,rightCol;
    if(isCasc){
      topCol='rgba(220,38,38,.85)';leftCol='rgba(185,28,28,.82)';rightCol='rgba(153,27,27,.82)';
    }else if(isSel){
      topCol='rgba(2,119,168,.9)';leftCol='rgba(2,90,145,.85)';rightCol='rgba(3,105,161,.85)';
    }else if(bStatus==='critical'){
      topCol='rgba(220,38,38,.82)';leftCol='rgba(185,28,28,.78)';rightCol='rgba(153,27,27,.78)';
    }else if(bStatus==='warning'){
      topCol='rgba(217,119,6,.82)';leftCol='rgba(180,83,9,.78)';rightCol='rgba(146,64,14,.78)';
    }else{
      topCol=typeCol.top;leftCol=typeCol.left;rightCol=typeCol.right;
    }

    const{gx,gy,w,d,h}=bl;
    const bl0=isoProj(gx,gy,0,scale,cx,cy);
    const br0=isoProj(gx+w,gy,0,scale,cx,cy);
    const fl0=isoProj(gx,gy+d,0,scale,cx,cy);
    const fr0=isoProj(gx+w,gy+d,0,scale,cx,cy);
    const bl1=isoProj(gx,gy,h,scale,cx,cy);
    const br1=isoProj(gx+w,gy,h,scale,cx,cy);
    const fl1=isoProj(gx,gy+d,h,scale,cx,cy);
    const fr1=isoProj(gx+w,gy+d,h,scale,cx,cy);

    // Left face
    ctx.beginPath();ctx.moveTo(bl0.x,bl0.y);ctx.lineTo(bl1.x,bl1.y);ctx.lineTo(fl1.x,fl1.y);ctx.lineTo(fl0.x,fl0.y);ctx.closePath();
    ctx.fillStyle=leftCol;ctx.fill();
    ctx.strokeStyle=isSel?'var(--cyan)':'rgba(255,255,255,.3)';ctx.lineWidth=isSel?2:.6;ctx.stroke();

    // Right face
    ctx.beginPath();ctx.moveTo(br0.x,br0.y);ctx.lineTo(br1.x,br1.y);ctx.lineTo(fr1.x,fr1.y);ctx.lineTo(fr0.x,fr0.y);ctx.closePath();
    ctx.fillStyle=rightCol;ctx.fill();
    ctx.strokeStyle=isSel?'var(--cyan)':'rgba(255,255,255,.3)';ctx.lineWidth=isSel?2:.6;ctx.stroke();

    // Top face
    ctx.beginPath();ctx.moveTo(bl1.x,bl1.y);ctx.lineTo(br1.x,br1.y);ctx.lineTo(fr1.x,fr1.y);ctx.lineTo(fl1.x,fl1.y);ctx.closePath();
    ctx.fillStyle=topCol;ctx.fill();
    ctx.strokeStyle=isSel?'#fff':'rgba(255,255,255,.4)';ctx.lineWidth=isSel?2:.7;ctx.stroke();

    // Specific detailing: solar panels cell pattern
    if(bl.cat==='power'&&h<=0.3){
      ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=.7;
      for(let ci=1;ci<=3;ci++){
        const sp1=isoProj(gx+w*(ci/4),gy,h,scale,cx,cy);
        const sp2=isoProj(gx+w*(ci/4),gy+d,h,scale,cx,cy);
        ctx.beginPath();ctx.moveTo(sp1.x,sp1.y);ctx.lineTo(sp2.x,sp2.y);ctx.stroke();
      }
    }

    // Specific detailing: VSAT Comms Tower mast & antenna dish
    if(bl.cat==='comms'){
      const topC=isoProj(gx+w/2,gy+d/2,h,scale,cx,cy);
      const mastTip=isoProj(gx+w/2,gy+d/2,h+0.45,scale,cx,cy);
      ctx.strokeStyle='#0277a8';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(topC.x,topC.y);ctx.lineTo(mastTip.x,mastTip.y);ctx.stroke();
      ctx.beginPath();ctx.arc(mastTip.x,mastTip.y-3,7,-Math.PI*0.85,Math.PI*0.15);
      ctx.strokeStyle='#0277a8';ctx.lineWidth=2.5;ctx.stroke();
      ctx.beginPath();ctx.moveTo(mastTip.x-1,mastTip.y-3);ctx.lineTo(mastTip.x+3,mastTip.y-7);
      ctx.strokeStyle='#d97706';ctx.lineWidth=1.5;ctx.stroke();
    }

    // Status beacon halo & dot on roof
    const dotPt=isoProj(gx+w/2,gy+d/2,h,scale,cx,cy);
    ctx.beginPath();ctx.arc(dotPt.x,dotPt.y-4,6,0,6.28);
    ctx.fillStyle=bStatus==='critical'||isCasc?'rgba(220,38,38,.3)':bStatus==='warning'?'rgba(217,119,6,.3)':'rgba(5,150,105,.3)';
    ctx.fill();
    ctx.beginPath();ctx.arc(dotPt.x,dotPt.y-4,3,0,6.28);
    ctx.fillStyle=bStatus==='critical'||isCasc?'#dc2626':bStatus==='warning'?'#d97706':'#059669';
    ctx.fill();

    // Floating full label pill (NO TRUNCATION!)
    const labelPt=isoProj(gx+w/2,gy+d/2,h+0.35,scale,cx,cy);
    ctx.font='bold 11px system-ui';
    const textW=ctx.measureText(bl.nm).width;
    const pillW=textW+24;
    const pillH=20;
    const pillX=labelPt.x-pillW/2;
    const pillY=labelPt.y-pillH-4;

    ctx.save();
    ctx.shadowColor='rgba(2,119,168,.16)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;
    ctx.fillStyle=isSel?'rgba(255,255,255,0.98)':'rgba(255,255,255,0.92)';
    ctx.strokeStyle=isSel?'var(--cyan)':isCasc?'#dc2626':bStatus==='critical'?'#dc2626':bStatus==='warning'?'#d97706':'rgba(144,204,232,0.85)';
    ctx.lineWidth=isSel?2:1;
    // draw pill
    const pr=10;
    ctx.beginPath();
    ctx.moveTo(pillX+pr,pillY);ctx.lineTo(pillX+pillW-pr,pillY);
    ctx.arcTo(pillX+pillW,pillY,pillX+pillW,pillY+pillH,pr);
    ctx.lineTo(pillX+pillW,pillY+pillH-pr);
    ctx.arcTo(pillX+pillW,pillY+pillH,pillX+pillW-pr,pillY+pillH,pr);
    ctx.lineTo(pillX+pr,pillY+pillH);
    ctx.arcTo(pillX,pillY+pillH,pillX,pillY+pillH-pr,pr);
    ctx.lineTo(pillX,pillY+pr);
    ctx.arcTo(pillX,pillY,pillX+pr,pillY,pr);
    ctx.closePath();ctx.fill();ctx.stroke();
    ctx.restore();

    // Dot inside pill
    ctx.beginPath();ctx.arc(pillX+9,pillY+pillH/2,3.5,0,6.28);
    ctx.fillStyle=bStatus==='critical'||isCasc?'#dc2626':bStatus==='warning'?'#d97706':'#059669';ctx.fill();

    // Full building name text
    ctx.fillStyle='#0c1f35';ctx.font='bold 11px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(bl.nm,pillX+17,pillY+pillH/2);
  }

  // Interactive Click selection (front-to-back testing)
  cv.onclick=e=>{
    const rect=cv.getBoundingClientRect();const mx=e.clientX-rect.left;const my=e.clientY-rect.top;
    for(const bl of [...sorted].reverse()){
      const{gx,gy,w,d,h}=bl;
      const c=isoProj(gx+w/2,gy+d/2,h/2,scale,cx,cy);
      if(Math.abs(mx-c.x)<scale*w*0.75&&Math.abs(my-c.y)<scale*h*0.85){
        twinSelected=bl.id;twinCascade=[];drawIsoTwin();showBldgInfo(bl);return;
      }
    }
    twinSelected=null;twinCascade=[];drawIsoTwin();el('twin-popup').style.display='none';
    el('twin-info-panel').innerHTML=`<div style="font-size:.84rem;color:var(--muted);text-align:center;padding:26px 0">${ic('map',28)}<br><br><strong>Select a facility module</strong><br><span style="font-size:.76rem">Click any building on the isometric grid to inspect connected sensors and operational status.</span></div>`;
  };
}

function simCascade(){
  if(!twinSelected){toast('Select a building first.','y');return;}
  const bldgs=APP.station==='maitri'?BLDGS_MAITRI:BLDGS_BHARATI;
  const bl=bldgs.find(b=>b.id===twinSelected);if(!bl)return;
  twinCascade=bl.deps||[];
  drawIsoTwin();
  if(twinCascade.length){toast(`Failure cascade: ${twinCascade.length} buildings affected if ${bl.nm} fails.`,'r');}
  else{toast(`${bl.nm} has no downstream dependencies in simulation.`,'b');}
}
function clearCascade(){twinCascade=[];drawIsoTwin();toast('Simulation cleared.','g');}

function aCard(a){return`<div class="al-card ${a.level}" id="al-${a.id}">
  <div style="flex:1">
    <div style="display:flex;gap:6px;margin-bottom:4px;align-items:center">
      <span class="tag ${lcls(a.level)}">${a.level.toUpperCase()}</span>
      <span class="tag ${a.status==='active'?'ty':'tg'}">${a.status.toUpperCase()}</span>
      <span style="font-size:.68rem;color:var(--muted);margin-left:auto">${ago(a.ts)}</span>
    </div>
    <div style="font-weight:700;color:var(--text)">${a.title}</div>
    <div style="font-size:.75rem;color:var(--muted);margin-top:2px">${a.msg}</div>
    <div style="font-size:.72rem;color:var(--dim);margin-top:3px">${ic('map',10)} ${a.loc||''} ${a.action?'| Action: '+a.action:''}</div>
  </div>
  ${a.status==='active'&&canDo('alert.ack')?`<div style="display:flex;flex-direction:column;gap:4px">
    <button class="btn btn-g" style="font-size:.7rem;padding:4px 8px" onclick="ackA('${a.id}')">Ack</button>
    <button class="btn btn-ghost" style="font-size:.7rem;padding:4px 8px" onclick="resA('${a.id}')">Resolve</button>
  </div>`:''}
</div>`;}
function fAlerts(q){const list=el('al-list');if(!list)return;const filtered=ST().alerts.filter(a=>!q||a.title.toLowerCase().includes(q.toLowerCase())||a.msg.toLowerCase().includes(q.toLowerCase()));list.innerHTML=filtered.map(a=>aCard(a)).join('')||'<div style="text-align:center;color:var(--muted);padding:20px">No matches</div>';}
function ackA(id){const a=ST().alerts.find(x=>x.id===id);if(a){a.status='acknowledged';rAlerts();updBadge();}}
function resA(id){const a=ST().alerts.find(x=>x.id===id);if(a){a.status='resolved';rAlerts();updBadge();}}
function ackAll(){ST().alerts.forEach(a=>{if(a.status==='active')a.status='acknowledged';});rAlerts();updBadge();toast('All alerts acknowledged.','g');}
function testAlert(){mkAlert({title:'System Test Alert',msg:'This is a test alert — all systems nominal.',level:'warning',loc:'Control Room',action:'No action required.'});rAlerts();}

function doEmerg(t){

    fire:{title:'Fire / Smoke Hazard Alert',msg:'Fire suppression systems primed. All personnel to muster stations.',loc:'Station Wing'},

function drawEvac(cv){
  if(!cv)return;
  const pw=cv.parentElement?cv.parentElement.clientWidth:0;
  if(pw>80){
    const tw=Math.round(cv.clientWidth||pw);
    if(tw>100&&cv.width!==tw)cv.width=tw;
  }
  const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);

  // Background polar grid
  ctx.fillStyle='rgba(240,249,255,.96)';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(2,119,168,.08)';ctx.lineWidth=1;
  const gs=28;
  for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Station architectural layout boundaries (Central hub + 4 wings)
  const cx=W*0.48, cy=H*0.52;
  const rw=Math.min(W*0.45,210), rh=Math.min(H*0.45,140);
  const left=cx-rw/2, top=cy-rh/2;

  // Station ground pad
  ctx.fillStyle='rgba(2,119,168,.07)';ctx.strokeStyle='rgba(2,119,168,.3)';ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.roundRect(left-10,top-10,rw+20,rh+20,12);
  ctx.fill();ctx.stroke();

  // Rooms / Modules
  const rooms=[
    {name:'Crew Habitat & Mess', x:left, y:top, w:rw*0.48, h:rh*0.48, col:'#6366f1'},
    {name:'Central Command', x:left+rw*0.52, y:top, w:rw*0.48, h:rh*0.48, col:'#0284c7'},
    {name:'Power & Engineering', x:left, y:top+rh*0.52, w:rw*0.48, h:rh*0.48, col:'#f59e0b'},
    {name:'Medical & Science Lab', x:left+rw*0.52, y:top+rh*0.52, w:rw*0.48, h:rh*0.48, col:'#059669'}
  ];

  rooms.forEach(r=>{
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.strokeStyle=r.col;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,6);ctx.fill();ctx.stroke();

    ctx.fillStyle=r.col;ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(r.name, r.x+r.w/2, r.y+r.h/2);

    // Safety gear markers
    ctx.font='9px system-ui';ctx.fillStyle='#dc2626';
    ctx.fillText('[FE]', r.x+16, r.y+14);
    ctx.fillStyle='#059669';
    ctx.fillText('[+]', r.x+r.w-16, r.y+14);
  });

  // Central corridor cross
  ctx.strokeStyle='rgba(2,119,168,.25)';ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(left, cy);ctx.lineTo(left+rw, cy);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx, top);ctx.lineTo(cx, top+rh);ctx.stroke();

  // Exits (Doors)
  const exits=[
    {name:'EXIT A (North)', x:cx, y:top-10, align:'center', target:{x:cx, y:36}, color:'#059669'},
    {name:'EXIT B (East)', x:left+rw+10, y:cy, align:'left', target:{x:W-44, y:cy}, color:'#d97706'},
    {name:'EXIT C (South)', x:cx, y:top+rh+10, align:'center', target:{x:cx, y:H-30}, color:'#0284c7'}
  ];

  exits.forEach(ex=>{
    // Door pill
    ctx.fillStyle='#dc2626';ctx.beginPath();
    ctx.roundRect(ex.x-18, ex.y-7, 36, 14, 4);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 8px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('EXIT', ex.x, ex.y);

    // Escape routes with dashed green/amber line and arrows
    ctx.strokeStyle=ex.color;ctx.lineWidth=2.5;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(ex.x, ex.y);ctx.lineTo(ex.target.x, ex.target.y);ctx.stroke();
    ctx.setLineDash([]);
  });

  // Assembly Point Alpha (North Heated Emergency Shelter)
  const apx=cx, apy=36;
  ctx.beginPath();ctx.arc(apx, apy, 18, 0, Math.PI*2);
  ctx.fillStyle='rgba(5,150,105,.18)';ctx.fill();
  ctx.strokeStyle='#059669';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(apx, apy, 4, 0, Math.PI*2);ctx.fillStyle='#059669';ctx.fill();
  ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='#065f46';
  ctx.fillText('MUSTER POINT ALPHA (North Heated Bunker — 45m)', apx, apy+22);

  // Assembly Point Bravo (East Logistics Shelter)
  const bpx=Math.min(W-40, cx+rw/2+80), bpy=cy;
  ctx.beginPath();ctx.arc(bpx, bpy, 18, 0, Math.PI*2);
  ctx.fillStyle='rgba(217,119,6,.18)';ctx.fill();
  ctx.strokeStyle='#d97706';ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(bpx, bpy, 4, 0, Math.PI*2);ctx.fillStyle='#d97706';ctx.fill();
  ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='#92400e';
  ctx.fillText('MUSTER POINT BRAVO (65m)', bpx, bpy+22);

  // Cardinal orientation (Compass rose in top-right)
  const cpx=Math.max(W-45, 45), cpy=42;
  ctx.beginPath();ctx.arc(cpx, cpy, 16, 0, Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();ctx.strokeStyle='var(--border)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#dc2626';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('N', cpx, cpy-5);
  ctx.beginPath();ctx.moveTo(cpx, cpy+2);ctx.lineTo(cpx-4, cpy+8);ctx.lineTo(cpx+4, cpy+8);ctx.closePath();
  ctx.fillStyle='var(--muted)';ctx.fill();

  // Bottom Legend
  ctx.fillStyle='#0c1f35';ctx.font='600 11px system-ui';ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillText('Legend:  ── Primary Route (Alpha)   ── Secondary Route (Bravo)   [FE] Fire Extinguisher   [+] First Aid Kit', 16, H-8);
}

        </div>
      </div>
    </div>`).join('')}
  </div>`;
}
function runSim(id){
  const s=SCEN.find(x=>x.id===id);if(!s)return;
  mkAlert({title:'Simulation: '+s.nm,msg:'SIMULATION MODE: '+s.ds,level:s.rk==='critical'?'critical':'warning',loc:'Station',action:s.resp});
  toast('Simulation "'+s.nm+'" activated.','y');
}

------------------------------------------------------------------------
Auditor: Station Environmental Officer & NCPOR Polar Logistics Command
Status:  COMPLIANT WITH ANTARCTIC TREATY ENVIRONMENTAL PROTOCOL
========================================================================`;

  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`${stn.name}_Environmental_Compliance_Report_${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();

  URL.revokeObjectURL(url);
  toast('Environmental Compliance Report downloaded.','g');

      <thead><tr><th>Report</th><th>Station</th><th>Generated</th><th>Size</th><th>Action</th></tr></thead>
      <tbody>
        ${[
          {n:'Environmental Compliance Q3',s:stn.name,d:'Today',sz:'187 KB',isEnv:true},
          {n:'Daily Operations - Sep 28',s:stn.name,d:'Today 06:00',sz:'284 KB',isEnv:false},
          {n:'Energy Report - Sep 27',s:stn.name,d:'Yesterday',sz:'196 KB',isEnv:false},
          {n:'Equipment Health Q3',s:'Both',d:'3 days ago',sz:'521 KB',isEnv:false},
          {n:'Personnel Safety Drill',s:stn.name,d:'7 days ago',sz:'88 KB',isEnv:false}
        ].map(r=>`<tr>
          <td style="font-weight:600">${r.n}</td>
          <td>${r.s}</td>
          <td style="color:var(--muted)">${r.d}</td>
          <td style="color:var(--muted)">${r.sz}</td>
          <td><button class="btn btn-ghost" style="padding:3px 8px;font-size:.7rem" onclick="${r.isEnv?'downloadEnvReport()':`toast('Downloading '+this.closest('tr').querySelector('td').textContent,'b')`}">${ic('download',12)} Download</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

/* ── LOGBOOK ─────────────────────────────────────────────────── */
function rLogbook(){
  const logs=ST().logbook;
  el('pg-logbook').innerHTML=`
  <div class="g2" style="margin-bottom:14px">
    <div class="card card-md">
      <div class="sec-hd">${ic('plus',14)} Add Entry</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <select id="lg-cat">
          ${['shift','maint','science','safety','inv','medical','incident'].map(c=>`<option value="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join('')}
        </select>
        <textarea id="lg-txt" rows="3" placeholder="Enter logbook entry..." style="resize:vertical"></textarea>
        <button class="btn btn-p" style="justify-content:center" onclick="addLog()">${ic('book',14)} Add Entry</button>
      </div>
    </div>
    <div class="card card-md">
      <div class="sec-hd">${ic('activity',14)} Stats</div>
      <div class="g2">
        ${[{lbl:'Total Entries',v:logs.length},{lbl:'Today',v:logs.filter(l=>new Date(l.ts).toDateString()===new Date().toDateString()).length},{lbl:'Maintenance',v:logs.filter(l=>l.cat==='maint').length},{lbl:'Science',v:logs.filter(l=>l.cat==='science').length}].map(x=>`<div class="kpi"><div class="kpi-v">${x.v}</div><div class="kpi-l">${x.lbl}</div></div>`).join('')}
      </div>
    </div>
  </div>
  <div style="position:relative;margin-bottom:10px">${ic('search',14)}<input id="lg-q" placeholder="Search logbook..." oninput="fLog(this.value)" style="width:100%;padding-left:24px"></div>
  <div id="lg-list">
    ${logs.map(l=>logCard(l)).join('')||'<div style="color:var(--muted);text-align:center;padding:20px">No entries</div>'}
  </div>`;
}
function logCard(l){return`<div class="card card-sm" style="margin-bottom:8px">
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
    <span class="tag tG">${l.cat}</span>
    <span style="font-size:.68rem;color:var(--muted)">${l.user}</span>
    <span style="font-size:.68rem;color:var(--muted);margin-left:auto">${ago(l.ts)}</span>
  </div>
  <div style="font-size:.8rem;color:var(--text)">${l.txt}</div>
</div>`;}
function fLog(q){const list=el('lg-list');if(!list)return;const filtered=ST().logbook.filter(l=>!q||l.txt.toLowerCase().includes(q.toLowerCase())||l.user.toLowerCase().includes(q.toLowerCase()));list.innerHTML=filtered.map(l=>logCard(l)).join('')||'<div style="color:var(--muted);text-align:center;padding:20px">No matches</div>';}
function addLog(){
  const cat=el('lg-cat')?.value||'shift';const txt=el('lg-txt')?.value?.trim()||'';
  if(!txt){toast('Please enter log text.','y');return;}
  const entry={id:'l'+Date.now(),ts:nowISO(),user:APP.user?.name||'Unknown',cat,txt};
  ST().logbook.unshift(entry);
  if(el('lg-txt'))el('lg-txt').value='';
  rLogbook();toast('Logbook entry added.','g');
}

/* ── SETTINGS ─────────────────────────────────────────────────── */
function toggleSetting(key){
  if(key==='sound'){
    SETTINGS.sound=!SETTINGS.sound;
    APP.sound=SETTINGS.sound;
    toast(`Sound alerts ${SETTINGS.sound?'enabled':'disabled'}.`, SETTINGS.sound?'g':'y');
    if(SETTINGS.sound) beep(660);
  } else if(key==='autoRefresh'){
    SETTINGS.autoRefresh=!SETTINGS.autoRefresh;
    if(SETTINGS.autoRefresh){
      if(!APP.simRun) APP.simRun=setInterval(simTick,5000);
      toast('Auto-refresh (5s interval) activated.','g');
    } else {
      if(APP.simRun){ clearInterval(APP.simRun); APP.simRun=null; }
      toast('Auto-refresh paused. Sensor simulation halted.','y');
    }
  } else if(key==='showOfflineBanner'){
    SETTINGS.showOfflineBanner=!SETTINGS.showOfflineBanner;
    updConnBanner();
    toast(`Offline banner ${SETTINGS.showOfflineBanner?'visible':'hidden'}.`, SETTINGS.showOfflineBanner?'g':'y');
  } else if(key==='storeAndForward'){
    SETTINGS.storeAndForward=!SETTINGS.storeAndForward;
    toast(`Store-and-forward sync ${SETTINGS.storeAndForward?'enabled':'disabled'}.`, SETTINGS.storeAndForward?'g':'y');
  }
  rSettings();
}

function rSettings(){
  const stn=ST();
  const toggleItems=[
    {id:'sound',lbl:'Sound Alerts',desc:'Audio chimes for critical system alerts and events',v:SETTINGS.sound},
    {id:'autoRefresh',lbl:'Auto Refresh (5s)',desc:'Live 5-second sensor updates and telemetry simulation',v:SETTINGS.autoRefresh},
    {id:'showOfflineBanner',lbl:'Show Offline Banner',desc:'Visible warning banner across station UI when satellite link drops',v:SETTINGS.showOfflineBanner},
    {id:'storeAndForward',lbl:'Store-and-Forward Sync',desc:'Queue generated sensor data locally during outages and sync upon reconnection',v:SETTINGS.storeAndForward}
  ];
  el('pg-settings').innerHTML=`
  <div class="g2">
    <div class="card card-md">
      <div class="sec-hd">${ic('cog',14)} System Settings</div>
      <div style="display:flex;flex-direction:column;gap:4px">
        ${toggleItems.map(s=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="flex:1;padding-right:12px;cursor:pointer" onclick="toggleSetting('${s.id}')">
            <div style="font-size:.82rem;font-weight:700;color:var(--text)">${s.lbl}</div>
            <div style="font-size:.7rem;color:var(--muted);margin-top:2px">${s.desc}</div>
          </div>
          <button type="button" aria-label="${s.lbl}" onclick="toggleSetting('${s.id}')" style="width:44px;height:24px;border-radius:12px;border:none;cursor:pointer;background:${s.v?'var(--cyan)':'rgba(144,204,232,.55)'};transition:background .2s;position:relative;flex-shrink:0;padding:0;outline:none;display:inline-block">
            <span style="position:absolute;top:3px;${s.v?'right:3px':'left:3px'};width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:all .2s ease"></span>
          </button>
        </div>`).join('')}
      </div>
    </div>
    <div class="card card-md">
      <div class="sec-hd">${ic('users',14)} User Profile</div>
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
        <div style="width:44px;height:44px;background:${roleC(APP.user?.role)};border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.1rem">${(APP.user?.name||'U')[0]}</div>
        <div><div style="font-weight:700">${APP.user?.name}</div><div style="font-size:.72rem;color:var(--muted)">${(ROLES[APP.user?.role]||{}).label}</div><div style="font-size:.68rem;color:var(--dim)">${APP.user?.email}</div></div>
      </div>
      <div style="font-size:.75rem;color:var(--muted);padding:8px;background:rgba(2,119,168,.05);border-radius:8px">
        <strong>Access level:</strong> ${APP.user?.role==='admin'?'Full access':'Restricted to '+JSON.stringify(PERMISSIONS[APP.user?.role]||[]).replace(/["\[\]]/g,'').replace(/,/g,', ')}
      </div>
    </div>
  </div>
  <div class="card card-md" style="margin-top:12px">
    <div class="sec-hd">${ic('activity',14)} System Information</div>
    <div class="g3">
      ${[{k:'Platform',v:'Antarctic Station Command v3.0'},{k:'Station',v:stn.fullName},{k:'Location',v:stn.loc},{k:'Coordinates',v:`${stn.lat}, ${stn.lon}`},{k:'Established',v:stn.est},{k:'Active Crew',v:stn.crew},{k:'Connectivity',v:CONN.status.toUpperCase()},{k:'Last HQ Sync',v:ago(CONN.lastSync.toISOString())},{k:'Simulation',v:SETTINGS.autoRefresh?'Active — 5s interval':'Paused (manual)'},{k:'Data Points',v:'288h history per sensor'},{k:'Equipment Tracked',v:stn.equipment.length},{k:'Resupply Date',v:stn.resupplyDate}].map(x=>`<div class="card-sm"><div style="font-size:.65rem;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:2px">${x.k}</div><div style="font-size:.78rem;color:var(--text);font-weight:600">${x.v}</div></div>`).join('')}
    </div>
  </div>`;
}

/* ── TAB SWITCHER ────────────────────────────────────────────── */
function sTab(btn,tgt){
  const tabs=btn.closest('.tabs');if(!tabs)return;
  tabs.querySelectorAll('.tab').forEach(t=>t.classList.remove('act'));btn.classList.add('act');
  const parent=tabs.nextElementSibling?.parentElement||tabs.parentElement;
  const prefix=tgt.split('-')[0]+'-';
  (parent||document).querySelectorAll('[id^="'+prefix+'"]').forEach(d=>d.style.display='none');
  const te=el(tgt);if(te)te.style.display='';
}

/* ── BOOT ────────────────────────────────────────────────────── */
function boot(){
  initStationSensors('maitri');
  initStationSensors('bharati');
  APP.simRun=setInterval(simTick,5000);
  initConn();
  APP.user=null;APP.token=null;
  try{localStorage.removeItem('adt_u');localStorage.removeItem('adt_t');}catch(e){}
  go('login');
  setTimeout(updBadge,300);
}

boot();
</script>
