<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IARI Monitor — Antarctic Station Monitoring</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: { 900: '#0f172a', 800: '#1e293b', 700: '#334155', 600: '#475569' },
              cyan: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2' },
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4,0,0.6,1) infinite',
              'fade-in': 'fadeIn 0.3s ease-in-out',
              'slide-in': 'slideIn 0.3s ease-out',
            },
            keyframes: {
              fadeIn:  { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideIn: { '0%': { transform: 'translateX(100%)', opacity: '0' }, '100%': { transform: 'translateX(0)', opacity: '1' } },
            },
          },
        },
      };
    </script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Inter', system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #1e293b; }
      ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
      .glass { background: rgba(30,41,59,0.7); backdrop-filter: blur(12px); border: 1px solid rgba(71,85,105,0.4); }
      .glow-cyan { box-shadow: 0 0 20px rgba(6,182,212,0.3); }
      .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
      .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(6,182,212,0.2); }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
